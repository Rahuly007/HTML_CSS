<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Form</title>
</head>

<body>
    <form name="student_form" action="./demo.html" method="get" target="_blank" enctype="text/plain">
       
        <fieldset>
            <legend>STUDENT</legend>
            
            <label for="fname">Name:</label>
            <input type="text" name="firstname" id="fname" placeholder="john" size="30" maxlength="6" autofocus required> <br>
            
            <label for="email">Email:</label>
            <input type="email" name="email" id="email" placeholder="abc@gmail.com" size="30" required><br>
            
            <label for="Bdate">Date of Birth:</label>
            <input type="date" name="" id="Bdate"  required><br>
            
            <label for="">Address:</label>
            <input type="text" placeholder="address" size="30" ><br>
            
            <label for="enroll">Enroll No :</label>
            <input type="text" id="enroll" maxlength="11" size="30" placeholder="22014011006">
        
        </fieldset>
        <br>
        <input type="submit" value="Submit">

    </form>
</body>

</html>
