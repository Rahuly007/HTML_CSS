<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Sofia&effect=3d|fire|fire-animation|ouline|neon|emboss|shadow-multiple">
    <title>Document</title>
    <style>
        p{
            font-size: x-large;
        }
        p.a{
           font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif; 
           color: darkblue;
           font-style: italic;
           font-weight: bolder;
           font-variant: small-caps;
        }
        p.b{
            font-family:"Sofia",'Times New Roman', Times, serif;
        }
    </style>
</head>
<body>
    <p class="a font-effect-neon">Ganpat University</p>
    <p class="b font-effect-outline">Ganpat University</p>
    <p class="font-effect-shadow-multiple">Ganpat University</p>
    <p class="font-effect-emboss">Ganpat University</p>
</body>
</html>
