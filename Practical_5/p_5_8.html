<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #ul-bgcolor {
            list-style-image: url('./images/clock.png');
            background-color: blue;
            list-style-position:inside;
        }
        #ol-bgcolor{
            background-color: brown;
        }
        #ul-bgcolor li{
            background-color: orange;
            font-size: 24px;
        }
        #ol-bgcolor li{
            background-color: orange;
            font-size: 24px;
        }
    </style>
</head>
<body>
    <ul id="ul-bgcolor">
        <li>HTML</li>
        <li>CSS</li>
        <li>Boostrap</li>
        <li>PHP</li>
        <li>MySql</li>
    </ul>
    <ol id="ol-bgcolor">
        <li>HTML</li>
        <li>CSS</li>
        <li>Boostrap</li>
        <li>PHP</li>
        <li>MySql</li>
    </ol>
</body>
</html>
