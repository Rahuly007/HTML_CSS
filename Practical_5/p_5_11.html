<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Style Link</title>
    <style>
        a:link {
            background-color: yellow;
        }

        a:visited {
            background-color: cyan;
        }

        a:hover {
            background-color: lightgreen;
        }

        a:active {
            background-color: hotpink;
        }
    </style>
</head>

<body>
    <h1>Styling a link with background-color property</h1>
    <a href="https://www.ganpatuniversity.ac.in/about/vision-mission-and-quality-statement">Ganpat university</a>
    <p>Note: a:hover MUST come after a:link and a:visited in the CSS definition in order to be effective.</p>
    <p>Note: a:active MUST come after a:hover in the CSS definition in order to be effective.</p>
</body>

</html>
