<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odd Even</title>
</head>
<body>
    <script>
        const num = Number(window.prompt("Enter a whole number"));
        if(num>0){
            if(num%2==0){
                alert(`${num} is even`)
            }else{
                alert(`${num} is odd`)
            }
        }else{
            document.write("Invalid Number")
        }
    </script>
</body>
</html>
