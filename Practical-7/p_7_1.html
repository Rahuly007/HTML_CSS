<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function myfunction(){
            document.getElementsById("para").innerHTML = "Hello"; 
        }
    </script>
</head>
<body>
    <p id="para">A Paragraph</p>
    <button type="button" onclick="myfunction()">Click Here</button>
    <script>document.write("This is the first example of JavaScript.")</script>
</body>
</html>
