<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p:first-child {
            color: blue;
        }

        p i:nth-child(even) {
            color: blue;
        }
    </style>
</head>

<body>

    <p>This is some text.</p>
    <p>This is some text.</p>

    <div>
        <p>This is some text.</p>
        <p>This is some text.</p>
    </div>

    <hr>

    <p>I am a <i>strong</i> person. I am a <i>strong</i> person.</p>
    <p>I am a <i>strong</i> person. I am a <i>strong</i> person.</p>

</body>

</html>
