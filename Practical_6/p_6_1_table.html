<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table {
            border-collapse: collapse;
            width: 50%;
            height: 300px;
            caption-side: bottom;
        }

        tr,
        td,
        th {
            border-collapse: collapse;
        }

        td,
        th {
            /* text-align: center;
            vertical-align: middle; */
            padding: 25px;
            border-bottom: 1px solid black;
        }

        tr:nth-child(even) {
            background-color: rgb(203, 201, 199);
        }

        tr:hover {
            background-color: tomato;
        }

        th {
            background-color: rgb(14, 134, 14);
            color: white;
        }
    </style>
</head>

<body>
    <div style="overflow-x: auto;">
        <table>
            <caption>Table 1.1 Company List</caption>
            <tr>
                <th>Company</th>
                <th>Headquater</th>
                <th>Type</th>
            </tr>
            <tr>
                <td>Google</td>
                <td>USA</td>
                <td>Public</td>
            </tr>
            <tr>
                <td>Facebook</td>
                <td>USA</td>
                <td>Public</td>
            </tr>
            <tr>
                <td>Koch Industries</td>
                <td>INDIA</td>
                <td>Private</td>
            </tr>
            <tr>
                <td>Dr. Patho</td>
                <td>INDIA</td>
                <td>Private</td>
            </tr>
        </table>
    </div>
</body>

</html>
